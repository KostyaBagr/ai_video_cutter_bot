services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SQLITE_PATH: /app/.data/bot.db
      VIDEO_CACHE_DIR: /app/.cache/videos
      # .env keeps a host-relative path; inside the container the file is mounted here
      YTDLP_COOKIES_FILE: /app/cookies.txt
    volumes:
      - bot-data:/app/.data
      - bot-cache:/app/.cache
      # TikTok/YouTube auth: create cookies.txt locally, then mount it:
      - ./cookies.txt:/app/cookies.txt:ro
    # Set in .env for the container path:
    # YTDLP_COOKIES_FILE=/app/cookies.txt

volumes:
  bot-data:
  bot-cache:
